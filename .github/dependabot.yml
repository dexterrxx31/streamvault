# Dependabot: weekly dependency update PRs for every ecosystem in the repo.
# Security updates are separate and immediate once "Dependabot security
# updates" is enabled in the repo's Settings → Code security.
version: 2
updates:
  # Spring Boot backend (backend/pom.xml)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]
      jjwt:
        patterns: ["io.jsonwebtoken:*"]
      flyway:
        patterns: ["org.flywaydb:*"]
    ignore:
      # Major Spring Boot upgrades need a deliberate migration, not an auto-PR
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # Angular frontend (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Angular packages must move in lockstep
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      test-tooling:
        patterns: ["vitest", "@vitest/*", "@analogjs/*", "jsdom"]
    ignore:
      # Major Angular upgrades go through `ng update`, not a version bump
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  # CI workflow actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  # Postgres image in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Postgres major versions need a data migration (pg_upgrade/dump)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
