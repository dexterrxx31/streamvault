spring.application.name=streamvault
server.port=8080

# PostgreSQL (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/streamvault
spring.datasource.username=streamvault
spring.datasource.password=${DB_PASSWORD:streamvault}
# Schema is owned by Flyway migrations (db/migration); Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate

# File Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Secrets come from the environment and have no defaults: startup fails if
# they're missing. Each must be at least 32 bytes (e.g. `openssl rand -base64 48`).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
# Signs the short-lived stream/thumbnail/captions URLs
app.media.secret=${MEDIA_SECRET}
app.media.url-ttl-seconds=7200

# Upload directory
app.upload.dir=./uploads

# Media processing binaries (must be on PATH or absolute paths)
app.ffmpeg.path=ffmpeg
app.ffprobe.path=ffprobe

# Whisper transcription (optional — feature disabled when model path is empty)
app.whisper.path=${WHISPER_PATH:whisper-cli}
app.whisper.model.path=${WHISPER_MODEL_PATH:}
