services:
  postgres:
    image: postgres:16-alpine
    container_name: streamvault-postgres
    environment:
      POSTGRES_DB: streamvault
      POSTGRES_USER: streamvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:-streamvault}
    ports:
      # Loopback only — do not expose the database to the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
